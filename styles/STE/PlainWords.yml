# DocTools.PlainWords holds the shared entries. These entries are specific to this repository.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  utilization: use
  terminate: stop
  in the event that: if
  at this point in time: now
  a number of: several
  in conjunction with: with
  aforementioned: this
  whilst: while
  amongst: among
